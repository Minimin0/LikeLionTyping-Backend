spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:typing;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  admin:
    password-hash: test-overridden
    token-secret: test-token-secret-at-least-32-characters
  allowed-origins: http://localhost:5173
