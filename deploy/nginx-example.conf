log_format likelion_api '$remote_addr [$time_local] '
                          '"$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent $request_time';

server {
    listen 443 ssl http2;
    server_name typing.example.com;

    ssl_certificate /etc/letsencrypt/live/typing.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/typing.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;
    access_log /var/log/nginx/likelion-typing.access.log likelion_api;
    error_log /var/log/nginx/likelion-typing.error.log warn;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name typing.example.com;
    return 301 https://$host$request_uri;
}
